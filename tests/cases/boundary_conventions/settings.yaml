# Test fixture: boundary_conventions
# -----------------------------------------------------------------------
# Pins the off-by-one conventions of break_down_by_period -- the
# left-closed right-open periods [start, end), the +1 arrival/departure
# day rule, and which side of a boundary each edge case lands on. These
# are exactly the rules a future refactor would break silently, and the
# User Guide now promises them in writing.
#
# Two periods: P1 = [2021-01-01, 2021-01-15), P2 = [2021-01-15, 2021-02-01).
# Cap 40 (never binds). Five animals:
#   1: intake Jan  2, outcome Jan  2 (SAME DAY) -> LOS = 1 by the +1 rule:
#      P1 row (0,1], event=1, days_at_risk = 1.
#   2: intake Jan 10, outcome Jan 15 (EXACTLY ON the boundary): outcome is
#      not < P1's end, so P1 gets a censored row (0,5]; the event belongs
#      to P2 as a left-truncated row (5,6], event=1. Total LOS 6.
#   3: intake Jan 14 (LAST DAY of P1), outcome Jan 20: P1 row (0,1]
#      censored at the boundary; P2 row (1,7], event=1.
#   4: intake Jan 15 (EXACTLY ON the boundary): not < P1's end, so it
#      participates in P2 only: (0,4], event=1 (outcome Jan 18).
#   5: intake Jan  5, outcome Jan  9: plain uncut P1 row (0,5], event=1.
# -> P1: 4 rows, 2 events; P2: 3 rows, 3 events; 7 rows, 5 events total.
#
# Hand-derived per-period KM:
#   P1: day 1: 4 at risk, 1 event (animal 1; animal 3's censoring at the
#       same time leaves the risk set after the event) -> S = 3/4.
#       day 5: 2 at risk (2, 5), 1 event (5; 2 censored at 5) -> S = 3/8.
#       -> median = 5 (S(1) = 0.75 > 0.5, S(5) = 0.375 <= 0.5, no tie).
#   P2: day 4: 2 at risk (4, and 3's (1,7]; animal 2's (5,6] has not
#       entered yet), 1 event -> S = 1/2 EXACTLY. day 6: 2 at risk (2, 3),
#       1 event -> S = 1/4. day 7: 1 at risk -> S = 0.
#       -> S(4) = 0.5 is an exact tie with the median threshold, so the
#       reported median is the midpoint of the flat stretch [4, 6):
#       (4+6)/2 = 5 (same convention as the exact ties documented in
#       aj_competing_risks_mixed and stratified_km_animal_group; verified
#       directly against summary(survfit)$table before being written down).
#
# Hand-derived unified KM (pooled, animal 2's and 3's split rows exactly
# reconstruct their uncut intervals):
#   events at days 1, 4, 5, 6, 7 with risk sets 5, 4, 3, 2, 1
#   -> S = 4/5, 3/5, 2/5, 1/5, 0.
# -> median = 5 (S(4) = 0.6 > 0.5, S(5) = 0.4 <= 0.5, no tie),
#    percentile_90 = 7 (S(6) = 0.2 > 0.1, S(7) = 0 <= 0.1, no tie),
#    restricted mean = 1 + 3*(4/5) + 0.6 + 0.4 + 0.2 = 4.6, max_time = 7.
# See expected.R.
#
# animal_group splits the five animals so that BOTH boundary-split stays
# land in one stratum: LARGE = animals 2 and 3 (the two longest stays,
# each contributing a censored P1 row and a left-truncated P2 row),
# SMALL = animals 1, 4, 5 (uncut single-period rows). This is the only
# hand-derived fixture whose strata span a period boundary, so it pins
# the cross-period stratum semantics of the Excel By_Animal_Group sheet:
# the row-level counts (LARGE has 4 rows, 2 left-truncated, 2
# right-censored) diverge from the unified stay counts (2 stays, 0, 0)
# exactly as the sheet's caveat panel describes. See expected.R
# (expected_stratum_stats and the group entries of expected_stratified_km)
# for the derivations. The Cox fit gains an animal_group term, which is
# harmless here: only its shape (n, n_events) is pinned, not HR values.

period_dates:
  - 2021-01-01
  - 2021-01-15
  - 2021-02-01

restricted_stay_cap: 40

# SMALL events (days 1, 4, 5) and LARGE events (days 6, 7) never overlap,
# so animal_group is complete separation for Cox and its coefficient
# diverges. Reference the fastest-resolving group (SMALL) so the
# divergence is HR -> 0 (bounded, underflows gracefully) rather than
# HR -> +Inf -- the same choice, for the same reason, as in
# stratified_km_animal_group. Only the fit's shape is pinned here.
animal_group_reference: SMALL

discard_bad_rows: false
