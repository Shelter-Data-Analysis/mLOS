# Test fixture: massive_daily_ties (hand-built, deterministic)
# -----------------------------------------------------------------------
# WHAT THE TIE RULE ESTIMATES, on data built so the three candidate
# answers are far apart. Every animal arrives on 2024-01-01, so there is
# no left truncation and every risk set is the whole group; exits are
# then placed so that a fixed fraction of each group's risk set leaves
# every day.
#
#   LARGE: 256 of 512 leave the same day, 128 of the remaining 256 the
#          next day, then 64 of 128, 32, 16, 8, 4, 2. Daily outcome
#          probability q = 0.5 exactly.
#   SMALL: 384 of 512, then 96 of 128, 24 of 32, 6 of 8. q = 0.75
#          exactly.
#
# Each schedule stops at the first day whose exit count would not be a
# whole animal, and the survivors are censored at the period end. That
# is what keeps every count an exact fraction of its risk set with no
# padding: both groups run 510 exits and two censored animals, and the
# tie structure carries no arbitrary choices to be sensitive to.
#
# intake_type is a NULL two-level factor, carried so the stratified Cox
# variants have a second stratifier to run on. Each group is split into
# two identical halves of 256, so OWNER and STRAY are the same dataset
# twice: their hazard ratio is exactly 1, and the group variant's
# strata(intake_type) puts each half back on the schedule a single group
# of 256 would have run. Doubling the animals is what lets the split be
# exact, since 256, 128, 64, 32, 16, 8, 4, 2 halves evenly and 384, 96,
# 24, 6 splits into 192, 48, 12, 3 twice.
#
# SMALL's within-day outcome rate is exactly TWICE LARGE's, in the
# outcome-window sense of the math document Section 6.2: survival
# through a day is raised to the power 2, and 1 - 0.75 = (1 - 0.5)^2.
# The true within-day rate ratio is therefore exactly 2.
#
# Three estimands that nearly coincide on shelter-scale daily
# probabilities are pulled apart here, which is the point of the case:
#   within-day rate ratio  = 2    (what Efron targets)
#   daily probability ratio = 1.5  (0.75 / 0.50)
#   daily odds ratio        = 3    ((0.75/0.25) / (0.5/0.5))
# The tie rule moves the answer by more than a third of a hazard ratio,
# and Breslow lands on the probability ratio instead (see expected.R for
# both fitted values). On OC-scale daily probabilities (q around 0.06)
# the same contrast is 0.06 wide, which is why this case exists rather
# than a realistic one.
#
# Efron is an approximation, and at q this large it does not reach 2
# either: the large-sample Efron value for these two rates is 1.891.
# Section 6.2's claim that Efron targets the rate ratio is a small-q
# claim, sound to within 0.25% for q <= 0.12 and 5.5% out at q = 0.5.
# So expected.R pins the fitted value, not the truth of 2.
#
# Single period, one outcome type. LARGE and OWNER are the references,
# so the reported coefficients are SMALL against LARGE and STRAY against
# OWNER. Large dogs stay longer, which is the direction the sign carries
# here.
#
# The pooled fit and the group variant are the two coxph calls in
# mlos_cox.R, and this case pins both. Their Efron values differ in the
# fourth decimal, because duplicating a dataset changes how many events
# are tied and Efron's correction reads that count. Breslow's does not:
# it returns the same value for both, since a duplicated dataset squares
# its partial likelihood and leaves the maximum where it was. So the
# case also catches the two calls disagreeing about the rule.
#
# The period ends on 2024-01-09, the first day past LARGE's last exit,
# so the two censored animals are censored at day 8. restricted_stay_cap
# is 30, well past that, so it never binds.

period_dates:
  - 2024-01-01
  - 2024-01-09

restricted_stay_cap: 30
